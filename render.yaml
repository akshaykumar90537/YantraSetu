services:
  - type: web
    name: yantrasetu-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python dev.py init && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OTP_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://yantrasetu-eight.vercel.app
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_FROM
        value: akshaykumar90537@gmail.com
      - key: SMTP_USERNAME
        value: akshaykumar90537@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 330906384238-o1g8d57b9cu57bl87edalcg1a83o2b0v.apps.googleusercontent.com
      - key: PYTHON_VERSION
        value: 3.11.9


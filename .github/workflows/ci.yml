name: Validate YantraSetu natively
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql://ys_test:ci_test_only@localhost:5432/yantrasetu_test
      OTP_SECRET: ci-only-not-a-live-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Install native PostgreSQL and PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3 postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ys_test LOGIN SUPERUSER PASSWORD 'ci_test_only';"
          sudo -u postgres createdb -O ys_test yantrasetu_test
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements.txt
      - run: python dev.py test
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
